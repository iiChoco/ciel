<!doctype html>
<!-- The Chart: Ciel's local GUI. Served by ciel/remote/web.py, which also
     documents the WebSocket protocol this page speaks. Deliberately one
     self-contained file with zero external assets: it must render in a
     library basement with no network beyond the loopback.

     The look is "Iris" (Instrument, take E): the mark is the interface and
     everything else is a readout on its instrument ring. The page has no
     colour of its own — it borrows the state the mark is in (--st) for its
     labels, hairlines and caret, and lets go of it when the mark moves on.
     Instrument text is mono; Ciel's sentences are the one serif voice. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128' fill='none'%3E%3Ccircle cx='64' cy='64' r='62' fill='%23030608'/%3E%3Cg stroke='%23b6c6cd' stroke-width='6'%3E%3Cellipse cx='64' cy='64' rx='50' ry='19' transform='rotate(-38 64 64)'/%3E%3Cellipse cx='64' cy='64' rx='43' ry='15' transform='rotate(38 64 64)'/%3E%3Cellipse cx='64' cy='64' rx='36' ry='12' transform='rotate(90 64 64)'/%3E%3C/g%3E%3Ccircle cx='64' cy='64' r='6' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* --st cross-fades a little slower than the mark re-lights, so the room
     follows the mark rather than leading it. */
  @property --st { syntax: '<color>'; inherits: true; initial-value: #8fa8b3; }
  :root {
    /* Instrument base tokens. The names and values above the Iris line are
       what nutrition.html and the website's Instrument stylesheet vendored;
       they stay as they were so those copies remain a true subset. */
    --line: rgba(140, 240, 255, .14);
    --line-strong: rgba(140, 240, 255, .22);
    --glass-border: rgba(160, 240, 255, .28);
    --text: #dfe6e6;
    --text-dim: rgba(223, 230, 230, .65);
    --text-faint: rgba(223, 230, 230, .34);
    --gold: #e8c98a;
    --gold-dim: rgba(232, 201, 138, .45);
    --gold-line: rgba(232, 201, 138, .16);
    --serif: Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
    /* the state vocabulary: the mark engine's own seven lights */
    --st-idle: #8fa8b3;
    --st-listening: #7adea8;
    --st-thinking: #e8c98a;
    --st-reasoning: #b89be8;
    --st-deep: #8f9cff;
    --st-speaking: #a0f0ff;
    --st-error: #e88a8a;
    /* Iris: seven lights, one dark */
    --void: #020507;
    --room: #08141b;
    --ink: #ffffff;      /* values: every number */
    --ink-2: #c9d6dc;    /* prose */
    --ink-3: #8fa8b3;    /* secondary labels; idle grey doubles as the neutral */
    --ink-4: #6f8590;    /* labels */
    --say: "Iowan Old Style", Georgia, "Times New Roman", serif;
    --hair: color-mix(in srgb, var(--st) 25%, transparent);
    --rule: color-mix(in srgb, var(--st) 45%, transparent);
  }
  body[data-state="idle"] { --st: #8fa8b3; }
  body[data-state="listening"] { --st: #7adea8; }
  body[data-state="thinking"] { --st: #e8c98a; }
  body[data-state="reasoning"] { --st: #b89be8; }
  body[data-state="speaking"] { --st: #a0f0ff; }
  body[data-state="error"] { --st: #e88a8a; }

  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(70% 40% at 50% 18%, var(--room) 0%, var(--void) 100%) var(--void);
    color: var(--ink);
    font: 400 15px/1.5 var(--mono);
    display: flex;
    flex-direction: column;
    transition: --st 600ms ease;
  }
  button { font: inherit; background: none; border: none; color: inherit; cursor: pointer; padding: 0; }
  a { color: var(--st-thinking); } a:hover { color: var(--st-speaking); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  @keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }

  canvas.mark { display: block; width: 100%; height: 100%; }

  /* chips: square, hairline, in the instrument's voice */
  .chip {
    display: flex; align-items: center; gap: 8px;
    min-height: 32px; padding: 0 12px;
    border: 1px solid var(--ink-4);
    font: 500 11px/1 var(--mono);
    letter-spacing: .24em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--ink-3);
    white-space: nowrap;
  }
  a.chip:hover, button.chip:hover { border-color: var(--ink); color: var(--ink); }
  .short { display: none; } /* a chip's narrow-screen name, where .long is dropped */

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap;
    padding: 18px 28px 0;
    font: 500 11px/1 var(--mono);
    letter-spacing: .3em; text-transform: uppercase;
    flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; color: var(--st); }
  .brand .glyph { width: 22px; height: 22px; display: block; flex: none; }
  .controls { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
  #now { color: var(--ink); padding-left: 12px; font-variant-numeric: tabular-nums; }

  /* a lit control takes the state's colour; nothing else is ever filled */
  #agentsbtn { border-color: color-mix(in srgb, var(--st) 50%, transparent); }
  #agentsbtn:hover { border-color: var(--st); }
  #agentsbtn[hidden] { display: none; }
  #agentsbtn .arr { opacity: .6; letter-spacing: 0; }
  body.agentsopen #agentsbtn, body:not(.muted) #mute, body.speakback #speakback { color: var(--st); border-color: color-mix(in srgb, var(--st) 50%, transparent); }
  #restart.arming { color: var(--st-thinking); border-color: var(--st-thinking); box-shadow: 0 0 16px -4px var(--st-thinking); }

  /* visually hidden, read aloud: the armed state must reach ears too */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* the room: readings at the mark's left hand, the working agents at its right */
  #roomgrid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    grid-template-areas: "place mark ring";
    align-items: center; gap: 8px 32px;
    padding: 4px 28px 0;
    max-width: 1080px; width: 100%; margin: 0 auto;
    flex: none;
  }
  #markbox { grid-area: mark; width: min(240px, 50vw); aspect-ratio: 1; position: relative; }

  /* the readings: the world table (world.py). A reading is not a card: a
     label with its bearing, a white value, one line of age. Only the age
     carries colour; the value stays white however old. */
  #world {
    grid-area: place;
    display: grid; grid-template-columns: auto auto; justify-content: end;
    gap: 12px 24px; text-align: right; align-self: center;
  }
  #world .reading { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  #world .reading .k { font: 500 10px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-4); }
  #world .reading .v { font: 300 17px/1.1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  #world .reading .age { font: 500 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  #world .reading.warn .k { color: var(--st-thinking); }
  #world .reading.stale .age { color: var(--st-error); }
  #world .reading.stale .k { text-decoration: underline dashed color-mix(in srgb, var(--st-error) 60%, transparent); text-underline-offset: 4px; }

  /* the active-agent roster: a chip that counts, a column that lists */
  #agentsbar { grid-area: ring; display: none; flex-direction: column; gap: 14px; text-align: left; max-width: 360px; min-width: 0; }
  body.agentsopen.hasagents #agentsbar { display: flex; }
  #agentsbar .caption {
    display: flex; align-items: center; gap: 12px;
    font: 500 10px/1 var(--mono);
    letter-spacing: .3em; text-transform: uppercase;
    color: var(--ink-4);
  }
  #agentsbar .caption::after { content: ""; flex: 1; height: 1px; background: var(--hair); }
  #agentrows { display: flex; flex-direction: column; }
  .agent { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 4px 0; --kc: var(--ink-3); }
  .agent .glyph { width: 18px; height: 18px; display: block; }
  .agent .main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .agent .kind { font: 500 10px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--kc); }
  .agent .label { font: 400 15px/1.35 var(--say); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .detail { font: 400 11px/1.3 var(--mono); color: var(--ink-4); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .meta { font: 300 15px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .agent.deep { --kc: var(--st-deep); }
  .agent.watch { --kc: var(--st-listening); }
  .agent.timer { --kc: var(--st-speaking); }

  /* banners: the machine's own condition, a pane that is barely there */
  #conn {
    display: none;
    align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 12px; padding: 10px 28px;
    font: 500 10px/1.4 var(--mono);
    letter-spacing: .26em; text-transform: uppercase;
    flex: none;
  }
  #conn { border-top: 1px solid var(--st-thinking); background: color-mix(in srgb, var(--st-thinking) 6%, transparent); color: var(--st-thinking); }
  body.disconnected #conn, body.needtoken #conn { display: flex; }
  #conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st-thinking); box-shadow: 0 0 12px var(--st-thinking); animation: caret 1.1s ease-in-out infinite; flex: none; }
  body.needtoken #conn .dot { animation: none; }
  /* the token form: shown only when the server closed with 4401 */
  #tokenform { display: none; align-items: center; gap: 8px; margin-left: auto; }
  body.needtoken #tokenform { display: flex; }
  #tokenin {
    font: 400 13px/1.4 var(--mono); letter-spacing: .04em;
    background: color-mix(in srgb, var(--st-thinking) 4%, transparent); color: var(--ink);
    border: 1px solid color-mix(in srgb, var(--st-thinking) 45%, transparent);
    padding: 6px 10px; width: 220px; max-width: 45vw; outline: none;
  }
  #tokenin:focus { border-color: var(--st-thinking); box-shadow: 0 0 16px -4px var(--st-thinking); }
  #tokenbtn { min-height: 32px; padding: 0 12px; border: 1px solid var(--st-thinking); color: var(--st-thinking); font: inherit; letter-spacing: inherit; }
  #tokenbtn:hover { border-color: var(--ink); color: var(--ink); }

  /* muted: a choice, not a fault, so no band and nothing moves. The rule over
     the composer wears a label, the way an event row does, and the whole label
     is the way back. An unlit lamp, where #conn has a lit one. */
  #unmute {
    display: none;
    position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
    height: 32px; align-items: flex-end;
    font: 500 10px/1 var(--mono); letter-spacing: .26em; text-transform: uppercase;
    color: var(--ink-3); white-space: nowrap;
  }
  body.muted #unmute { display: flex; }
  #unmute .tag { display: flex; align-items: center; gap: 10px; padding: 6px 14px; background: var(--void); }
  #unmute .lamp { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-3); flex: none; }
  #unmute .do { color: var(--ink); padding-bottom: 2px; margin-bottom: -3px; border-bottom: 1px solid var(--ink-4); }
  #unmute:hover .do { border-bottom-color: var(--ink); }
  #unmute:focus-visible { outline: none; }
  #unmute:focus-visible .tag { outline: 2px solid var(--ink); outline-offset: 4px; }
  body.muted #mute > span:first-child { text-decoration: line-through; }

  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 0 24px; scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
  .inner { max-width: 760px; margin: 0 auto; padding: 0 28px; }
  #rows { display: flex; flex-direction: column; gap: 22px; }

  .row .body { white-space: pre-wrap; overflow-wrap: break-word; }
  .row .cap { font: 500 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-4); }

  /* you: a pane — 8% fill, a top rule, a fainter right rule */
  .row.you { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .row.you .body {
    max-width: 70%;
    padding: 11px 16px;
    background: color-mix(in srgb, var(--st) 8%, transparent);
    border-top: 1px solid var(--rule);
    border-right: 1px solid var(--hair);
    color: var(--ink);
    text-wrap: pretty;
  }

  /* ciel: the only non-instrument voice — a serif against a lit rule */
  .row.ciel { display: flex; flex-direction: column; gap: 8px; max-width: 82%; padding-left: 18px; border-left: 1px solid var(--st); box-shadow: -9px 0 12px -11px var(--st); }
  .row.ciel .cap { letter-spacing: .24em; color: var(--st); }
  .row.ciel .body { font: 400 18px/1.6 var(--say); color: var(--ink); text-wrap: pretty; }

  /* ciel, under its breath: the working notes */
  .row.thinking { display: flex; align-items: baseline; gap: 10px; }
  .row.thinking::before { content: ""; width: 14px; height: 1px; background: var(--ink-4); flex: none; align-self: center; }
  .row.thinking .body { font: 400 12px/1.5 var(--mono); color: var(--ink-4); }

  /* the historical record of a question that wanted you: always listening green */
  .row.confirmrow .body { max-width: 82%; padding-left: 18px; border-left: 1px solid var(--st-listening); }
  .row.confirmrow .cap { letter-spacing: .24em; color: var(--st-listening); margin-bottom: 8px; }
  .row.confirmrow .q { font: 400 17px/1.5 var(--say); color: var(--ink); text-wrap: pretty; white-space: pre-wrap; }

  /* events: a labelled hairline across the room */
  .row.event { display: flex; align-items: center; gap: 14px; }
  .row.event::before, .row.event::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--st) 20%, transparent); }
  .row.event .body {
    font: 500 10px/1.5 var(--mono);
    letter-spacing: .26em; text-transform: uppercase;
    color: var(--ink-4);
    text-align: center;
    max-width: 70%;
  }

  /* the caret: blinks while a turn is being worked on, and says which way */
  #busy { display: none; align-items: center; gap: 10px; margin-top: 22px; padding-left: 18px; border-left: 1px solid var(--st); height: 24px; font: 500 10px/1 var(--mono); letter-spacing: .24em; text-transform: uppercase; color: var(--st); }
  #busy .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--st); box-shadow: 0 0 12px var(--st); animation: caret 1.1s ease-in-out infinite; }
  body[data-state="thinking"] #busy, body[data-state="reasoning"] #busy { display: flex; }

  /* the live question: the mark goes to listening and waits on you. Yes is
     the only filled shape on the page, filled with the listening light. */
  #ask {
    --st: #7adea8;
    display: none;
    padding: 16px 28px;
    background: color-mix(in srgb, var(--st) 7%, transparent);
    border-top: 1px solid var(--st);
    box-shadow: 0 -1px 28px -10px var(--st);
    flex: none;
  }
  body.asking #ask { display: block; }
  #ask .arrange { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 20px; align-items: center; max-width: 1000px; margin: 0 auto; }
  #ask .askmark { position: relative; width: 56px; aspect-ratio: 1; }
  #ask .askmark svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  #ask .qwrap { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  #ask .cap { font: 500 10px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--st); }
  #ask .q { font: 400 19px/1.45 var(--say); color: var(--ink); text-wrap: pretty; overflow-wrap: break-word; white-space: pre-wrap; }
  #ask .btns { display: flex; gap: 10px; }
  #ask .btns button {
    min-width: 96px; min-height: 44px; padding: 0 22px;
    border-radius: 22px;
    font: 600 11px/1 var(--mono);
    letter-spacing: .3em; text-transform: uppercase;
  }
  #ask button.yes { background: var(--st); color: var(--void); box-shadow: 0 0 20px color-mix(in srgb, var(--st) 50%, transparent); }
  #ask button.yes:hover { background: #a6f0c8; }
  #ask button.no { border: 1px solid var(--ink-4); color: var(--ink); }
  #ask button.no:hover { border-color: var(--ink); }

  #composer { position: relative; display: flex; flex-direction: column; border-top: 1px solid var(--hair); background: #03090dcc; flex: none; }
  body.dropping #composer { border-top-color: var(--st); box-shadow: 0 -1px 28px -10px var(--st); }
  footer {
    display: flex; align-items: flex-end; gap: 12px;
    padding: 14px 28px calc(16px + env(safe-area-inset-bottom));
  }
  #text {
    flex: 1;
    resize: none;
    min-height: 44px; max-height: 160px;
    padding: 12px 15px;
    background: color-mix(in srgb, var(--st) 4%, transparent);
    border: 1px solid color-mix(in srgb, var(--st) 35%, transparent);
    border-radius: 0;
    color: var(--ink);
    font: 400 15px/1.4 var(--mono);
    outline: none;
  }
  #text::placeholder { color: var(--ink-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #text:focus { border-color: var(--st); box-shadow: 0 0 16px -4px var(--st); }
  #send, #attach {
    min-width: 44px; min-height: 44px; padding: 0 20px;
    border: 1px solid var(--ink-4);
    font: 600 10px/1 var(--mono);
    letter-spacing: .24em; text-transform: uppercase;
    color: var(--ink-3);
  }
  #attach { padding: 0 14px; }
  #attach:hover { border-color: var(--ink); color: var(--ink); }
  #attach[hidden] { display: none; }
  #send:not(:disabled) { color: var(--st); }
  #send:hover:not(:disabled) { border-color: var(--st); box-shadow: 0 0 16px -4px var(--st); }
  #send:disabled { color: var(--ink-4); cursor: default; }
  #attachments { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 28px 0; }
  #attachments:empty { display: none; }
  #attachments .chip {
    display: inline-flex; gap: 10px; max-width: 100%; min-height: 0;
    padding: 5px 6px 5px 10px; border-color: color-mix(in srgb, var(--st) 40%, transparent);
    font: 400 12px/1.3 var(--mono); letter-spacing: 0; text-transform: none; white-space: normal;
    color: var(--ink-2); overflow-wrap: anywhere;
  }
  #attachments .chip.error { border-color: var(--st-error); color: var(--st-error); }
  #attachments .chip button { color: var(--ink-3); font: 400 14px/1 var(--mono); padding: 2px 6px; }
  #attachments .chip button:hover { color: var(--ink); }

  /* saved responsibilities: the same material — hairlines, mono, no cards */
  #taskpanel { margin: 12px auto 0; width: calc(100% - 56px); max-width: 1024px; border-top: 1px solid var(--hair); padding: 8px 0; flex-shrink: 0; max-height: 42vh; overflow: auto; font: 400 13px/1.6 var(--mono); color: var(--ink-2); scrollbar-width: thin; scrollbar-color: var(--hair) transparent; }
  #taskpanel[hidden] { display: none; }
  #taskpanel summary { color: var(--ink-4); font: 500 10px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; cursor: pointer; padding: 8px 0; }
  #taskpanel summary:hover, #taskpanel[open] summary { color: var(--st); }
  #taskstatus { color: var(--ink-3); font: 400 12px/1.5 var(--mono); margin: 8px 0; overflow-wrap: anywhere; }
  #taskstatus.error { color: var(--st-error); }
  #tasklist, #taskdetail { overflow-wrap: anywhere; }
  #tasklist button { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; width: 100%; text-align: left; border-top: 1px solid var(--hair); padding: 8px 0 0; margin-bottom: 8px; color: var(--ink-2); }
  #tasklist button:hover { color: var(--ink); }
  #tasklist button[aria-pressed="true"] { color: var(--st); }
  #taskdetail { padding-top: 12px; }
  #taskdetail h3, #grants h3, #features h3 { font: 400 18px/1.4 var(--say); color: var(--ink); margin-bottom: 6px; }
  #taskdetail p, #taskdetail li { margin-bottom: 6px; }
  #taskdetail ol { padding-left: 20px; color: var(--ink-3); }
  .task-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .task-actions button, #taskrefresh, .notice-switch { min-height: 32px; border: 1px solid var(--ink-4); padding: 0 12px; font: 500 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  .task-actions button:hover, #taskrefresh:hover, .notice-switch:hover { border-color: var(--ink); color: var(--ink); }
  #tasklist .notice-switch { display: inline-block; width: auto; border: 1px solid var(--ink-4); margin: 8px 0; padding: 9px 12px; }
  #taskpanel button:disabled { opacity: .45; cursor: wait; }
  #grants { padding-top: 12px; border-top: 1px solid var(--hair); margin-top: 8px; overflow-wrap: anywhere; }
  #grants p, #grants li { margin-bottom: 6px; }
  #grants .dim, #features .dim { color: var(--ink-4); }
  #features .row { margin: 8px 0 0; }
  #grants form { border-top: 1px solid var(--rule); background: color-mix(in srgb, var(--st) 6%, transparent); padding: 10px 12px; margin: 8px 0; }
  #grants fieldset { border: none; padding: 0; margin: 6px 0; }
  #grants legend { color: var(--ink-4); font: 500 10px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; margin-bottom: 6px; }
  #grants label { display: block; margin: 3px 0; cursor: pointer; }
  #grants input[type="checkbox"] { accent-color: var(--st-listening); margin-right: 6px; }
  #grants select { font: 400 12px/1.4 var(--mono); color: var(--ink); background: var(--void); border: 1px solid var(--ink-4); border-radius: 0; padding: 5px 8px; max-width: 100%; }

  /* a short window gives the mark less of it, so the transcript keeps room */
  @media (max-height: 760px) { #markbox { width: min(168px, 40vw); } }
  /* and an open task panel takes more still: the mark gives way before the conversation does */
  body:has(#taskpanel[open]) #markbox { width: min(132px, 36vw); }

  @media (max-width: 760px) {

async function shrinkImage(file) {
  if (!file.type.startsWith("image/") || file.type === "image/gif") return file;
  let bitmap;
  try { bitmap = await createImageBitmap(file); } catch { return file; }
  const edge = Math.max(bitmap.width, bitmap.height);
  if (edge <= IMAGE_EDGE && file.size <= IMAGE_BYTES) { bitmap.close(); return file; }
  const scale = Math.min(1, IMAGE_EDGE / edge);
  const canvas = document.createElement("canvas");
  canvas.width = Math.max(1, Math.round(bitmap.width * scale));
  canvas.height = Math.max(1, Math.round(bitmap.height * scale));
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.85));
  if (!blob) return file;
  return new File([blob], file.name.replace(/\.[^.]+$/, "") + ".jpg", {type: "image/jpeg"});
}
async function addFiles(list) {
  for (const raw of list) {
    if (!raw || !uploadBytes) continue;
    const file = await shrinkImage(raw);
    const entry = {id: messageId(), name: file.name || "file", mime: file.type || "application/octet-stream", blob: file, error: null};
    if (file.size > uploadBytes) entry.error = `larger than ${sizeText(uploadBytes)}`;

    pending.push(entry);

}
function putFile(entry) {

    const reader = new FileReader();
    reader.onerror = () => reject(new Error("could not read the file"));
    reader.onload = () => {
      const data = String(reader.result).split(",")[1] || "";
      const timeout = setTimeout(() => { fileWaits.delete(entry.id); reject(new Error("no answer from the server")); }, 60000);
      fileWaits.set(entry.id, {resolve, reject, timeout});
      if (!sendFrame({type: "file.put", file_id: entry.id, name: entry.name, mime: entry.mime, data, size: entry.blob.size})) {

async function uploadPending() {

function say(t, files = []) {
  const message = {text: t, request_id: messageId()};
  if (files.length) message.files = files;
  if (!acks) {
    // No hello yet, or an older server: the pre-ledger lane, fire-and-forget.
    if (!sendFrame({ type: "say", ...message })) return false;
  } else {
    const seq = ++saySeq;
    unacked.set(seq, message);
    saveLedger();
    if (!sendFrame({ type: "say", ...message, seq })) {
      unacked.delete(seq);
      saveLedger();
      return false;
    }
  }
  clearAsk(); // whatever was pending, this line is the user's word on it
  return true;
}

// A confirm answer rides outside the ledger on purpose: a resend would
// arrive freshly stamped, and the pipeline answers whatever question is
// open *now* — a stale yes must never authorize a question the user
// never saw. A swallowed answer is merely an unanswered question, and
// the broker's timeout owns that case with the safe default.
function answer(word) {
  if (!sendFrame({ type: "say", text: word })) return;
  clearAsk();
}

const taskPanel = document.getElementById("taskpanel");
const taskStatus = document.getElementById("taskstatus");
const taskList = document.getElementById("tasklist");
const taskDetail = document.getElementById("taskdetail");
const taskRefresh = document.getElementById("taskrefresh");
const taskRequests = new Map();
let selectedTask = null;
let taskRefreshGeneration = 0;
let taskBusy = false;

function taskNotice(text, error = false) {
  taskStatus.textContent = text;
  taskStatus.classList.toggle("error", error);
}
function requestTask(operation, fields = {}, timeoutMs = 20000) {
  return new Promise((resolve, reject) => {
    const request_id = messageId();
    const timeout = setTimeout(() => {
      taskRequests.delete(request_id);
      reject(new Error("No task response. Refresh before retrying; the control may have been saved."));
    }, timeoutMs);
    taskRequests.set(request_id, {resolve, reject, timeout});
    if (!sendFrame({type: "task.request", request_id, operation, ...fields})) {
      clearTimeout(timeout);
      taskRequests.delete(request_id);
      reject(new Error("Offline. Reconnect and refresh to see the saved state."));
    }
  });
}
function taskText(parent, tag, text) {
  const element = document.createElement(tag);
  element.textContent = text;
  parent.appendChild(element);
  return element;
}
function taskState(task) {
  if (task.status === "waiting" && task.wait_reason === "resource") return "saved · execution unavailable";
  if (task.status === "waiting" && task.wait_reason === "owner") return "waiting for your answer";
  return task.status + (task.wait_reason ? " · " + task.wait_reason : "");

function showTask(data) {
  const task = data.task;

  taskText(taskDetail, "p", taskState(task));
  taskText(taskDetail, "p", "Next: read the selected checks · " + task.next_step.target);
  taskText(taskDetail, "p", task.detail || "No blocker recorded.");
  const question = data.question;
  const actions = document.createElement("div");
  actions.className = "task-actions";
  taskDetail.appendChild(actions);
  const control = (label, operation, fields = {}) => {
    const button = taskText(actions, "button", label);
    button.type = "button";
    button.disabled = taskBusy;
    button.addEventListener("click", async () => {
      if (taskBusy) return;
      taskBusy = true;
      actions.querySelectorAll("button").forEach(b => b.disabled = true);
      taskNotice("Saving control…");
      let failure = null;
      try { await requestTask(operation, {task_id: task.id, revision: task.revision, ...fields}); }
      catch (error) { failure = error.message; }
      finally { taskBusy = false; }
      await refreshTasks();

  if (task.status === "paused" || task.status === "failed" || (task.status === "waiting" && task.wait_reason === "resource")) control("Resume", "resume");
  if (!["done", "failed", "cancelled"].includes(task.status)) control("Cancel", "cancel");
  if (question && task.status === "waiting" && task.wait_reason === "owner") {
    taskText(taskDetail, "p", question.prompt);

  }
  taskText(taskDetail, "p", task.status === "done" ? "Completion evidence" : "Last observations");
  if (!data.evidence.length) taskText(taskDetail, "p", "No observation recorded.");
  for (const evidence of data.evidence) {
    const age = Math.max(0, Math.floor(Date.now() / 1000 - evidence.observed_at));
    taskText(taskDetail, "p", `${evidence.criterion_id}: ${evidence.observed ?? "unknown"} · ${evidence.source} · ${age}s ago · head ${evidence.target_revision || "unverified"}`);
  }
  const history = document.createElement("ol");

  for (const entry of data.history) taskText(history, "li", `${entry.after_status}: ${entry.detail}`);
  if (data.authority) {

    taskText(taskDetail, "p", a.kind === "grant"
      ? `Authority: grant ${a.grant_status}${a.grant_current ? "" : " (revised since)"} · mandate ${a.mandate_status}`

  }
  for (const intent of data.unresolved || []) taskText(taskDetail, "p", `Unresolved effect: ${intent.operation} on ${intent.target} · sent, outcome unknown`);
  for (const notice of data.notices || []) {
    const last = notice.deliveries[notice.deliveries.length - 1];
    const seen = notice.deliveries.some(d => d.outcome === "acknowledged");

// ── standing grants: the form, the drafts, the mandates ─────────────────
// A draft is what the owner is looking at; Approve sends the revision and
// digest rendered here, and the broker's question arrives on this socket
// alone as the ordinary confirm prompt. A yes there is the only thing that
// makes a grant; this page never assumes one.
const grantsEl = document.getElementById("grants");
const featuresEl = document.getElementById("features");
let draftEditing = null; // {id, revision, namespace, operations, targets} while a saved draft is being edited

  const found = (setup ? setup[kind] : []).find(([v]) => v === value);
  return found ? found[1] : value;
}
function grantScope(setup, scope) {
  return scope.operations.map(o => grantLabel(setup, "operations", o)).join(", ") + " on " +
    scope.targets.map(t => grantLabel(setup, "targets", t)).join(", ");

async function grantControl(operation, fields, busyText, timeoutMs, panel = grantsEl) {

// ── the features' own rows: candidates from email, and whatever comes next ──
// Every string here is the feature's reading of someone else's mail; it is
// shown as text, never as markup, and the controls are the ones it named.
function showFeatures(data) {

      taskText(featuresEl, "p", about + (row.unresolved.length ? ` · unsettled: ${row.unresolved.join(", ")}` : "")
        + (row.event ? ` · ${row.event.status} on ${row.event.calendar}${row.event.note ? " (" + row.event.note + ")" : ""}` : "")).className = "dim";
      const actions = document.createElement("div");
      actions.className = "task-actions";

        b.disabled = taskBusy;
        b.addEventListener("click", handler);
      };
      if (row.controls.includes("inbox_add")) button("Add to calendar", () => grantControl("inbox_add", {candidate: row.key}, "Saving the add…", undefined, featuresEl));
      if (row.controls.includes("inbox_dismiss")) button("Dismiss", () => grantControl("inbox_dismiss", {candidate: row.key}, "Dismissing…", undefined, featuresEl));
      for (const proposal of row.proposals) {

function showGrants(data) {
  grantsEl.replaceChildren();
  const setups = data.setups || [], drafts = data.drafts || [], mandates = data.mandates || [], grants = data.grants || [];
  if (!setups.length && !drafts.length && !mandates.length) return;
  taskText(grantsEl, "h3", "Standing grants");
  const bySetup = new Map(setups.map(s => [s.namespace, s]));
  const button = (parent, label, handler) => {
    const b = taskText(parent, "button", label);
    b.type = "button";
    b.disabled = taskBusy;
    b.addEventListener("click", handler);
    return b;
  };
  for (const mandate of mandates) {
    const grant = grants.find(g => g.id === mandate.grant_id);
    const setup = bySetup.get(mandate.namespace);
    const title = setup ? setup.title : mandate.namespace;
    taskText(grantsEl, "p", `${title} · ${mandate.outcome} · ${mandate.status} · ${mandate.children} derived`);
    if (grant) taskText(grantsEl, "p", `${grantScope(setup, grant.scope)} · until ${new Date(grant.expires_at * 1000).toLocaleDateString()}`).className = "dim";
    const actions = document.createElement("div");
    actions.className = "task-actions";
    grantsEl.appendChild(actions);
    if (mandate.status === "active") button(actions, "Pause", () => grantControl("mandate_pause", {mandate_id: mandate.id, revision: mandate.revision}, "Pausing…"));
    if (mandate.status === "paused") button(actions, "Resume", () => grantControl("mandate_resume", {mandate_id: mandate.id, revision: mandate.revision}, "Resuming…"));
    if (grant && !["revoked", "expired"].includes(grant.status)) button(actions, "Revoke grant", () => grantControl("grant_revoke", {grant_id: grant.id, revision: grant.revision}, "Revoking…"));
  }
  for (const draft of drafts) {
    const setup = bySetup.get(draft.namespace);
    taskText(grantsEl, "p", `Draft · ${setup ? setup.title : draft.namespace} · ${grantScope(setup, draft.scope)} · revision ${draft.revision}`);
    taskText(grantsEl, "p", `${draft.outcome} · as ${draft.bindings.map(([, v]) => v).join(", ") || "no account"} · up to ${draft.limits.max_per_window} per window, ${draft.limits.max_children} in all · digest ${draft.digest.slice(0, 12)}`).className = "dim";
    const actions = document.createElement("div");
    actions.className = "task-actions";
    grantsEl.appendChild(actions);
    button(actions, "Approve", () => {
      taskNotice("Answer the question in the conversation to approve this draft.");
      grantControl("grant_approve", {draft_id: draft.id, revision: draft.revision, digest: draft.digest}, "Waiting for your answer…", 180000);
    });
    if (setup) button(actions, "Edit", () => { draftEditing = {id: draft.id, revision: draft.revision, namespace: draft.namespace, operations: draft.scope.operations, targets: draft.scope.targets}; showGrants(data); });
    button(actions, "Discard", () => grantControl("grant_draft_discard", {draft_id: draft.id, revision: draft.revision}, "Discarding…"));
  }
  if (!setups.length) return;
  const form = document.createElement("form");
  grantsEl.appendChild(form);
  const editing = draftEditing && bySetup.has(draftEditing.namespace) ? draftEditing : null;
  taskText(form, "legend", editing ? "Edit draft" : "New draft");
  const picker = document.createElement("select");
  picker.setAttribute("aria-label", "Feature");
  for (const setup of setups) {
    const option = document.createElement("option");
    option.value = setup.namespace;
    option.textContent = setup.title;
    picker.appendChild(option);
  }
  // The feature picked decides whose operations and targets the boxes show:
  // with two features offering grants, boxes built from the first while the
  // picker showed the second sent one feature's operations under the other's
  // name, and the hub rightly refused them as not offered.
  picker.value = editing ? editing.namespace : (data._picked && bySetup.has(data._picked) ? data._picked : setups[0].namespace);
  picker.disabled = !!editing;
  form.appendChild(picker);
  const setup = bySetup.get(picker.value);
  const boxes = {};
  for (const kind of ["operations", "targets"]) {
    const set = document.createElement("fieldset");
    taskText(set, "legend", kind);
    boxes[kind] = [];
    for (const [value, label] of setup[kind]) {
      const row = document.createElement("label");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.value = value;
      box.checked = editing ? editing[kind].includes(value) : true;
      row.appendChild(box);
      row.appendChild(document.createTextNode(label));
      set.appendChild(row);
      boxes[kind].push(box);
    }
    form.appendChild(set);
  }
  taskText(form, "p", `${setup.outcome} · on ${setup.host} as ${setup.bindings.map(([, v]) => v).join(", ") || "no account"} · up to ${setup.limits.max_per_window} per window, ${setup.limits.max_children} in all, for ${Math.round(setup.limits.lifetime_s / 86400)} days`).className = "dim";
  picker.addEventListener("change", () => { draftEditing = null; showGrants({...data, _picked: picker.value}); });
  const actions = document.createElement("div");
  actions.className = "task-actions";
  form.appendChild(actions);
  button(actions, editing ? "Save changes" : "Save draft", () => {
    const fields = {namespace: picker.value, operations: boxes.operations.filter(b => b.checked).map(b => b.value), targets: boxes.targets.filter(b => b.checked).map(b => b.value)};
    if (editing) Object.assign(fields, {draft_id: editing.id, revision: editing.revision});
    draftEditing = null;
    grantControl("grant_draft_save", fields, "Saving draft…");
  });
  if (editing) button(actions, "Stop editing", () => { draftEditing = null; showGrants(data); });

async function refreshTasks() {
  if (taskPanel.hidden || !taskPanel.open) return;
  const generation = ++taskRefreshGeneration;
  taskNotice("Loading tasks…");
  try {
    const data = await requestTask("list");
    if (generation !== taskRefreshGeneration) return;
    taskList.replaceChildren();
    for (const task of data.tasks) {
      const button = taskText(taskList, "button", task.specification.outcome + " · " + taskState(task));
      button.type = "button";
      button.setAttribute("aria-pressed", String(selectedTask === task.id));
      button.title = task.specification.outcome;
      button.addEventListener("click", async () => {
        selectedTask = task.id;
        await refreshTasks();
        taskDetail.focus();
        taskDetail.scrollIntoView({block: "nearest"});
      });
    }
    taskNotice((data.tasks.length ? "Saved requests." : "No saved tasks.")
      + (data.notify === false ? " Notices muted; tasks keep running." : "")
      + (data.owed ? ` ${data.owed} notice${data.owed === 1 ? "" : "s"} owed.` : ""));
    if (data.notify !== undefined) {
      const sw = taskText(taskList, "button", data.notify ? "Mute notices" : "Unmute notices");
      sw.type = "button";
      sw.className = "notice-switch";
      sw.title = "The notice switch only; execution is unaffected";
      sw.addEventListener("click", async () => {
        try { await requestTask(data.notify ? "notices_mute" : "notices_unmute"); } catch (error) { taskNotice(error.message, true); }
        await refreshTasks();
      });
    }
    showGrants(data);
    showFeatures(data);
    if (selectedTask) {
      const detail = await requestTask("inspect", {task_id: selectedTask});
      if (generation === taskRefreshGeneration) showTask(detail);
    } else taskDetail.replaceChildren();
  } catch (error) {
    if (generation === taskRefreshGeneration) taskNotice(error.message, true);
  }
}
taskPanel.addEventListener("toggle", () => { if (taskPanel.open) refreshTasks(); });
taskRefresh.addEventListener("click", refreshTasks);

function connect() {
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/ws`);

  ws.onopen = () => {
    retryMs = 500;
    attempts = 0;
    document.body.classList.remove("disconnected");
    sendBtn.disabled = false;
    // Capabilities reset until this server's hello claims them — a say
    // sent in the gap rides seq-less rather than joining a ledger the
    // hello is about to resend (the double would be manufactured here).
    acks = false;
    // The client speaks first: who, the proof, and where it left off.
    const hello = { type: "hello", v: 1, role: "chart", client_id: clientId, caps: ["acks", "resume"] };
    const token = hubToken();
    if (token) hello.token = token;
    if (epoch !== null) hello.resume = { epoch, seq: lastSeq };
    sendFrame(hello);
  };

  ws.onmessage = (ev) => {
    clearProbe(); // any inbound frame is proof of life
    let f;
    try { f = JSON.parse(ev.data); } catch { return; }
    if (f.type !== "hello" && f.type !== "ack" && Number.isInteger(f.seq)) {
      lastSeq = f.seq; // every broadcast frame moves the resume claim
      saveResume();
    }
    if (f.type === "hello") {
      // The capability handshake: the ledger, the probe, and the restart
      // chip all wait for the server to say it speaks them.
      acks = !!f.acks;
      uploadBytes = f.files === true && Number.isInteger(f.upload_bytes) ? f.upload_bytes : 0;
      attachBtn.hidden = !uploadBytes;
      taskPanel.hidden = f.tasks !== true;
      if (!taskPanel.hidden) refreshTasks();
      restartBtn.style.display = acks ? "" : "none";
      if (acks) {
        // Settle the ledger: whatever the last socket swallowed rides again.
        for (const [seq, message] of unacked) sendFrame({ type: "say", ...message, seq });
      } else if (unacked.size) {
        unacked.clear(); // debts an ack-less server can never settle
        saveLedger();
      }
      if (typeof f.epoch === "string") {
        epoch = f.epoch;
        lastSeq = Number.isInteger(f.seq) ? f.seq : 0;
        saveResume();
      }
      if (!f.resumed) {
        // A fresh picture: the history window replaces whatever was
        // drawn. A resumed one keeps the screen — the frames this page
        // missed follow the hello one by one, as if nothing dropped.
        rows.textContent = "";
        for (const r of f.history || []) addRow(r.role, r.text, r.t);
        logEl.scrollTop = logEl.scrollHeight;
      }
      setState(f.state || "idle", f.source);
      setMuted(!!f.muted);
      setSpeakBack(!!f.speakback);
      setAgents(f.agents);
      setWorld(f.world);
    } else if (f.type === "task.result") {
      const pending = taskRequests.get(f.request_id);
      if (pending) {
        clearTimeout(pending.timeout);
        taskRequests.delete(f.request_id);
        if (f.ok) pending.resolve(f.data);
        else pending.reject(new Error(f.error || "Task request failed."));
      }
    } else if (f.type === "file.result") {
      const wait = fileWaits.get(f.file_id);
      if (wait) {
        clearTimeout(wait.timeout);
        fileWaits.delete(f.file_id);
        if (f.ok) wait.resolve(f); else wait.reject(new Error(f.error || "refused"));
      }
    } else if (f.type === "task.changed") {
      if (!taskBusy) refreshTasks();
    } else if (f.type === "nutrition.receipt") {
      addRow("ciel", f.data.text, Date.now() / 1000);
    } else if (f.type === "row") {
      addRow(f.role, f.text, f.t);
      if (f.role && f.role.startsWith("you-confirm")) clearAsk();
    } else if (f.type === "state") {
      setState(f.state, f.source);
      if (f.state === "idle") clearAsk(); // the question expired with its turn
    } else if (f.type === "muted") {
      setMuted(!!f.muted);
    } else if (f.type === "speakback") {
      setSpeakBack(!!f.on);
    } else if (f.type === "agents") {
      setAgents(f.agents);
    } else if (f.type === "world") {
      setWorld(f.facts, f.sources);
    } else if (f.type === "confirm") {
      askQ.textContent = f.text;
      document.body.classList.add("asking");
      const stick = nearBottom();
      if (stick) logEl.scrollTop = logEl.scrollHeight;
    } else if (f.type === "ack") {
      unacked.delete(f.seq);
      saveLedger();
    }
  };

  ws.onclose = (ev) => {
    for (const pending of taskRequests.values()) {
      clearTimeout(pending.timeout);
      pending.reject(new Error("Disconnected. Refresh after reconnecting; a control may already have been saved."));
    }
    taskRequests.clear();
    taskNotice("Offline. Reconnect to refresh saved tasks.", true);
    attempts += 1;
    document.body.classList.add("disconnected");
    sendBtn.disabled = true;
    clearAsk();
    clearProbe(); // a pending deadline must not shoot the next socket
    disarmRestart(); // an armed chip must not survive into the fresh process
    if (ev && ev.code === 4401) {
      // The server wants the hub token — this page is off loopback.
      // No retry loop: the form reconnects when the user submits.
      connLabel.textContent = hubToken() ? "hub token refused" : "hub token needed";
      document.body.classList.add("needtoken");
      tokenIn.focus();
      return;
    }
    connLabel.textContent = attempts > 1
      ? "reconnecting to Ciel · attempt " + attempts
      : "reconnecting to Ciel";
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 2, 8000);
  };
  ws.onerror = () => ws.close();
}

let submitting = false;
async function submit() {
  const t = text.value.trim();
  if (submitting || (!t && !pending.length)) return;
  submitting = true;
  sendBtn.disabled = true;
  try {
    let files = [];
    try { files = await uploadPending(); }
    catch (error) { addRow("event", "a file was not sent: " + error.message, Date.now() / 1000); return; }
    if (!say(t || "(see the attached files)", files)) return; // not connected — keep the draft; the banner says why
    pending.length = 0;
    renderPending();
    text.value = "";
    text.style.height = "auto";
  } finally {
    submitting = false;
    sendBtn.disabled = !ws || ws.readyState !== WebSocket.OPEN;
    text.focus();
  }
}

sendBtn.addEventListener("click", submit);
text.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); submit(); }
});
text.addEventListener("input", () => {
  text.style.height = "auto";
  text.style.height = Math.min(text.scrollHeight, 160) + "px";
});
muteBtn.addEventListener("click", () => sendFrame({ type: "mute", muted: !muted }));
speakBtn.addEventListener("click", () => sendFrame({ type: "speakback.set", on: !speakBack }));
unmuteBtn.addEventListener("click", () => sendFrame({ type: "mute", muted: false }));

// The restart chip arms on the first click and fires on the second — a
// stray click must not cost the mic and the models a relaunch. The server
// answers with an event row, and the reconnect banner narrates the rest.
const restartBtn = document.getElementById("restart");
const restartLabel = document.getElementById("restartlabel");
const srStatus = document.getElementById("srstatus");
let restartArm = null;
let restartArmedAt = 0;

function disarmRestart() {
  if (restartArm !== null) clearTimeout(restartArm);
  restartArm = null;
  restartBtn.classList.remove("arming");
  restartBtn.setAttribute("aria-pressed", "false");
  restartBtn.style.minWidth = "";
  restartLabel.textContent = "RESTART";
  srStatus.textContent = "";
}

restartBtn.addEventListener("click", () => {
  if (restartArm === null) {
    // Freeze the hit target: the shorter armed label must not shift the
    // chip row under a cursor that is about to click again.
    restartBtn.style.minWidth = restartBtn.offsetWidth + "px";
    restartBtn.classList.add("arming");
    restartBtn.setAttribute("aria-pressed", "true");
    restartLabel.textContent = "SURE?";
    srStatus.textContent = "Armed — press again to restart Ciel";
    restartArmedAt = Date.now();
    restartArm = setTimeout(disarmRestart, 4000);
    return;
  }
  // A second click this fast is a bounce or a habitual double-click, not
  // a decision — SURE? was never readable. The arm stands; a real second
  // click still fires.
  if (Date.now() - restartArmedAt < 350) return;
  // Refused (reconnecting): stay armed rather than disarm into a look
  // identical to success — the caller keeps what it was trying to send.
  if (!sendFrame({ type: "restart" })) return;
  disarmRestart();
});

// The liveness probe: ask the server for any frame at all. A browser can
// hold a socket OPEN long after the far side gave up on it (the machine
// slept, the tab was frozen), and protocol-level pings are invisible to
// page script — so ask at the app layer. No answer inside the deadline
// means the socket is a ghost: close it, and the usual reconnect path
// (with the ledger resend) does the rest.
let probeDeadline = null;

function clearProbe() {
  if (probeDeadline !== null) clearTimeout(probeDeadline);
  probeDeadline = null;
}

function verifyLink() {
  // Gated on acks: a server that never pongs would make every probe
  // shoot a healthy socket.
  if (!acks || !ws || ws.readyState !== WebSocket.OPEN || probeDeadline !== null) return;
  sendFrame({ type: "ping" });
  probeDeadline = setTimeout(() => { probeDeadline = null; ws.close(); }, 3000);
}

// When to suspect the socket: coming back to the tab (a bfcache restore
// lands here too), and a slow heartbeat that catches the rest — a
// machine-level sleep under a page that stayed visible, a peer gone
// without a FIN. Hidden tabs are left alone: their timers throttle by
// design, and the visibility handler probes the moment they matter again.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") verifyLink();
});
setInterval(() => {
  if (document.visibilityState === "visible") verifyLink();
}, 15000);

connect();
</script>
</body>
</html>
